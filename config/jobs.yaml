# ============================================================
# Scrape Job Schedule Configuration
# ============================================================
# Each job defines what to scrape, which engine to use, and how often.
# Business/source coverage and restoration priority: source_coverage.yaml
#
# Schedule format: cron expression (minute hour day month weekday)
#   "0 * * * *"     = every hour
#   "0 */6 * * *"   = every 6 hours
#   "0 0 * * *"     = daily at midnight
#   "0 9 * * *"     = daily at 9am
#   "0 0 * * 0"     = weekly on Sunday
#   "0 0 1 * *"     = monthly on the 1st
#
# Engines: httpx | playwright | selenium | scrapy | rss
#
# Data freshness guide:
#   - Job listings:     daily  (jobs expire fast)
#   - Product prices:   every 6 hours (price changes frequent)
#   - Restaurant/business: weekly (stable data)
#   - News articles:    every 2 hours (breaking news)
#   - Real estate:      daily (new listings)
#   - Social media:     every 4 hours (trending content)
# ============================================================

settings:
  default_rate_limit: 2.0
  default_timeout: 30
  max_retries: 3
  cache_enabled: true
  cache_ttl: 86400  # 24 hours
  export_formats:
    - json
    - csv
  data_dir: data/
  log_level: INFO

jobs:
  # News, classifieds, and restaurant jobs moved to book-news-scraping,
  # book-ecommerce-scraping, and book-restaurant-scraping (their own crons).

  # ── REAL ESTATE (daily) ──────────────────────────────────
  - name: ddproperty_condos
    category: property
    engine: httpx
    url: "https://www.ddproperty.com/เช่าคอนโด"
    schedule: "0 8 * * *"
    enabled: false  # pending: httpx collection is Cloudflare 403; parser is ready for Thai /เช่าคอนโด
    rate_limit: 3.0
    max_pages: 5
    scraper_module: "property.ddproperty_scraper"
    scraper_class: "DDPropertyScraper"
    params:
      type: condo
      max_price: 30000

  - name: ennxo_condo_sale
    category: property
    engine: httpx
    url: "https://www.ennxo.com/condo/for-sale"
    schedule: "0 9 * * *"
    enabled: false  # planned: adapter and fixture smoke pass; terms/retention review pending
    rate_limit: 1.0
    max_pages: 1
    scraper_module: "property.portal_scrapers"
    scraper_class: "PortalPropertyScraper"
    params:
      source: ennxo
      type: condo_sale_thailand
      max_price: 5000000
      output_stem: property_ennxo_listings

  - name: propertyhub_condo_rent
    category: property
    engine: httpx
    url: "https://propertyhub.in.th/เช่าคอนโด"
    schedule: "0 10 * * *"
    enabled: false  # planned: adapter and fixture smoke pass; terms/retention review pending
    rate_limit: 1.0
    max_pages: 1
    scraper_module: "property.portal_scrapers"
    scraper_class: "PortalPropertyScraper"
    params:
      source: propertyhub
      type: condo_rent_thailand
      max_price: 30000
      output_stem: property_propertyhub_listings

  - name: livinginsider_condo_rent
    category: property
    engine: httpx
    url: "https://www.livinginsider.com/condo-rent"
    schedule: "0 11 * * *"
    enabled: false  # planned: adapter and fixture smoke pass; terms/retention review pending
    rate_limit: 1.0
    max_pages: 1
    scraper_module: "property.portal_scrapers"
    scraper_class: "PortalPropertyScraper"
    params:
      source: livinginsider
      type: condo_rent_thailand
      max_price: 30000
      output_stem: property_livinginsider_listings

  - name: zmyhome_condo_rent
    category: property
    engine: httpx
    url: "https://zmyhome.com/rent/condo?maxPriceFilter=10000"
    schedule: "0 12 * * *"
    enabled: false  # planned: adapter and fixture smoke pass; terms/retention review pending
    rate_limit: 1.0
    max_pages: 1
    scraper_module: "property.portal_scrapers"
    scraper_class: "PortalPropertyScraper"
    params:
      source: zmyhome
      type: condo_rent_thailand
      max_price: 30000
      output_stem: property_zmyhome_listings

  # ── TG CONDO RSS (public feed; contact enrichment is gated) ──
  - name: tgcondo_condo_rent
    category: property
    engine: rss
    url: "https://www.tgcondo.com/Property-Types/condo-for-rent?format=feed&type=rss"
    schedule: "0 */6 * * *"
    enabled: false  # planned: verify source terms/retention before scheduling
    rate_limit: 1.0
    scraper_module: "scripts.scrape_tgcondo_rss"
    scraper_class: "TGCondoRSSScraper"
    params:
      feed_url: "https://www.tgcondo.com/Property-Types/condo-for-rent?format=feed&type=rss"
      limit: 40
      include_agent_contact: false

  # ── CRYPTO PRICES (every 4 hours) ─────────────────────────
  - name: crypto_prices
    category: finance
    engine: httpx
    url: "https://api.coingecko.com/api/v3/simple/price"
    schedule: "0 */4 * * *"
    enabled: false  # migrated: book-crypto-data cron owns this feed
    rate_limit: 2.0
    scraper_module: "scripts.scrape_crypto_prices"
    scraper_class: "CryptoPriceScraper"
    params:
      coins:
        - bitcoin
        - ethereum
        - solana
        - binancecoin
        - ripple
        - cardano
        - dogecoin
        - polkadot
        - avalanche-2
        - chainlink
      vs_currencies:
        - usd
        - thb
      alert_threshold: 5.0

  # ── EXCHANGE RATES (every 6 hours) ────────────────────────
  - name: exchange_rates
    category: finance
    engine: httpx
    url: "https://api.frankfurter.dev/v1/latest"
    schedule: "0 */6 * * *"
    enabled: false  # migrated: book-fx-data cron owns this feed
    rate_limit: 1.0
    scraper_module: "scripts.scrape_exchange_rates"
    scraper_class: "ExchangeRateScraper"
    params:
      base: THB
      symbols:
        - USD
        - EUR
        - JPY
        - GBP
        - CNY
        - SGD
        - HKD
        - AUD
        - KRW
        - MYR
      alert_threshold: 0.5

  # ── GITHUB TRENDING (daily) ───────────────────────────────
  - name: github_trending
    category: dev
    engine: httpx
    url: "https://api.github.com/search/repositories"
    schedule: "0 10 * * *"
    enabled: true
    rate_limit: 1.0
    scraper_module: "scripts.scrape_github_trending"
    scraper_class: "GitHubTrendingScraper"
    params:
      languages:
        - python
        - javascript
        - typescript
        - rust
        - go
      since: daily
      min_stars: 50
      keywords:
        - ai
        - agent
        - saas
        - api
        - tool
        - framework
        - scraper
        - bot

  # ── HACKERNEWS (daily 9am) ──────────────────────────────────
  - name: hackernews
    category: dev
    engine: httpx
    url: "https://hacker-news.firebaseio.com/v0"
    schedule: "0 9 * * *"
    enabled: true
    rate_limit: 1.0
    scraper_module: "scripts.scrape_hackernews"
    scraper_class: "HackerNewsScraper"
    params:
      limit: 30

  # ── DEV.TO (daily 10am) ─────────────────────────────────────
  - name: devto_articles
    category: dev
    engine: httpx
    url: "https://dev.to/api/articles"
    schedule: "0 10 * * *"
    enabled: true
    rate_limit: 1.0
    scraper_module: "scripts.scrape_devto"
    scraper_class: "DevToScraper"
    params:
      tags:
        - python
        - typescript
        - javascript
        - react
        - nextjs
        - ai
        - webdev
        - programming
      per_page: 20

  # ── PRODUCTHUNT (daily 11am) ─────────────────────────────────
  - name: producthunt_top
    category: dev
    engine: httpx
    url: "https://www.producthunt.com/feed"
    schedule: "0 11 * * *"
    enabled: true
    rate_limit: 2.0
    scraper_module: "scripts.scrape_producthunt"
    scraper_class: "ProductHuntScraper"
    params:
      limit: 20

  # ── PROPERTY LISTINGS (daily) ─────────────────────────────
  - name: property_listings
    category: real_estate
    engine: firecrawl
    url: "https://www.ddproperty.com/condo-for-sale/bangkok"
    schedule: "0 9 * * *"
    enabled: true
    rate_limit: 5.0
    scraper_module: "scripts.scrape_property_listings"
    scraper_class: "PropertyListingScraper"
    params:
      type: condo_sale_bkk
      max_pages: 3
      alert_drop_pct: 10.0

  # ── PROPERTY SOCIAL LEADS (conditional; official API + public index only) ───
  - name: property_social_leads
    category: property
    engine: httpx
    url: "https://api.search.brave.com/res/v1/web/search"
    schedule: "0 */6 * * *"
    enabled: false  # requires API/storage rights, terms/PDPA, and human review
    rate_limit: 2.0
    scraper_module: "scripts.scrape_property_social"
    scraper_class: "PropertySocialLeadScraper"
    params:
      query: "อสังหา กรุงเทพ บ้าน คอนโด (รับ co-agent OR เจ้าของขายเอง OR นายหน้า)"
      platforms:
        - facebook
        - instagram
        - tiktok
        - line
      limit: 50

  # ── SEO RANKINGS (daily) ──────────────────────────────────
  - name: seo_rankings
    category: marketing
    engine: httpx
    url: "https://bookchaowalit.com/"
    schedule: "0 8 * * *"
    enabled: false  # migrated: book-seo-data cron owns this feed
    rate_limit: 3.0
    scraper_module: "scripts.scrape_seo_rankings"
    scraper_class: "SEORankingScraper"
    params:
      keywords:
        - "next.js developer bangkok"
        - "python developer thailand"
        - "full-stack developer bangkok"
        - "AI developer thailand"
        - "web scraping service"
        - "chatbot developer bangkok"
        - "freelance developer thailand"
        - "react developer bangkok"
      domains:
        - bookchaowalit.com
        - chaowalit.com
      alert_improve: 5

  # ── JOB POSTINGS (every 6 hours) ───────────────────────────
  - name: job_postings
    category: sales
    engine: firecrawl+httpx
    url: "https://remotive.com/api/remote-jobs"
    schedule: "0 */6 * * *"
    enabled: true
    rate_limit: 2.0
    scraper_module: "scripts.scrape_job_postings"
    scraper_class: "JobPostingScraper"
    params:
      boards:
        # API-based (reliable)
        - remotive
        - weworkremotely
        - remoteok
        - himalayas
        - jobicy
        # landing-jobs removed: robots.txt disallows /api/ (see source_coverage.yaml)
        - hn-hiring
        - workingnomads
        - themuse
        # remoteco removed: 0 jobs for weeks and search now times out (2026-09-30)
        # HTML scrapers (higher value, may break). toptal was removed: it had
        # no board of its own and scraped Google search results (Google ToS).
        - arc
        # Contract/freelance marketplaces
        - fastwork
        - peopleperhour
      keywords:
        - python contract
        - next.js contract
        - react freelance
        - AI automation contract
        - part-time full-stack
        - fractional engineer
        - contract-to-hire developer
        - paid trial software developer
        - apprenticeship software engineer
        - open source fellowship developer
        - volunteer software developer
        - stipend developer fellowship
        - eBPF community fellowship
      min_salary: 0

  # ── STOCK PRICES (daily 8am) ─────────────────────────────
  - name: stock_prices
    category: finance
    engine: httpx
    url: "https://query1.finance.yahoo.com/v8/finance/chart"
    schedule: "0 8 * * *"
    enabled: false  # migrated: book-stock-data cron owns this feed
    rate_limit: 1.0
    scraper_module: "scripts.scrape_stock_prices"
    scraper_class: "StockPriceScraper"
    params:
      symbols:
        - AAPL
        - MSFT
        - GOOGL
        - AMZN
        - NVDA
        - META
        - TSLA
        - SPY
        - QQQ
      range: 5d
      interval: 1d
      alert_threshold: 3.0

  # ── AI TOOLS (daily) ───────────────────────────────────────
  - name: ai_tools
    category: ai
    engine: httpx
    url: "https://www.futurepedia.io/ai-tools"
    schedule: "0 11 * * *"
    enabled: false  # retired 2026-10-23 with the ai_tools data product (data-product-contracts-v3); nothing collects this feed
    rate_limit: 4.0
    scraper_module: "scripts.scrape_ai_tools"
    scraper_class: "AIToolScraper"
    params:
      sources:
        - futurepedia
      categories:
        - ai-agents
        - productivity
        - code
      base_url: "https://www.futurepedia.io/ai-tools"
      max_pages: 2
      limit: 100
      min_rows: 10
      output_stem: ai_tools

  # ── DEFI YIELDS (daily 7am) ────────────────────────────
  - name: defi_yields
    category: finance
    engine: httpx
    url: "https://yields.llama.fi/pools"
    schedule: "0 7 * * *"
    enabled: false  # migrated: book-defi-data cron owns this feed
    rate_limit: 1.0
    scraper_module: "scripts.scrape_defi_yields"
    scraper_class: "DeFiYieldScraper"
    params:
      chains:
        - Ethereum
        - Arbitrum
        - Optimism
        - Polygon
        - Base
      min_apy: 5.0
      min_tvl_usd: 1000000
      max_apy: 100000
      limit: 200
      min_rows: 10
      max_age_hours: 24
      output_stem: defi_yields

  # Public company ATS capture; collection only, no application submission.
  - name: career_postings
    category: sales
    engine: httpx
    url: "https://boards-api.greenhouse.io"
    schedule: "0 */6 * * *"
    enabled: true
    rate_limit: 2.0
    scraper_module: "scripts.career_discovery"
    scraper_class: "CareerDiscovery"
    params: {}

  # ── JOB MATCH FILTER (runs after job_postings) ─────────────
  - name: job_match_filter
    category: sales
    engine: local
    url: null
    schedule: "0 */6 * * *"
    enabled: true
    rate_limit: 0.0
    scraper_module: "scripts.filter_job_matches"
    scraper_class: "JobMatchFilter"
    params:
      min_score: 5
      top: 15
      input: "data/job_postings.csv"
      supplemental_input: "data/career_postings.csv"
      output: "data/matched_jobs.csv"
      descriptions: "data/job_descriptions.csv"
      include_statuses:
        - PASS
        - VERIFY
      seed_tracker: true
      seed_min_score: 5

  # ── SCRAPER DASHBOARD (3x/day: 8:15, 11:15, 20:15) ───────
  - name: scraper_dashboard
    category: ops
    engine: local
    url: null
    schedule: "15 8,11,20 * * *"
    enabled: true
    rate_limit: 0.0
    scraper_module: "scripts.scraper_dashboard"
    scraper_class: "ScraperDashboard"
    params:
      format: both
      output: "data/briefings/scraper_dashboard.json"
